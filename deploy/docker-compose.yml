# NFSHS Online - deploy on a live host, either:
#   A) build from source:        docker compose up -d --build
#   B) pull the prebuilt image:  docker compose pull && docker compose up -d
# (B) is what a Watchtower container needs to auto-update this - see
# README.md. Update after a source change: re-run whichever of the two
# you used to start it.
# Logs:
#   docker compose logs -f
services:
  nfshs:
    build: .
    image: ghcr.io/bonkas/nfshs-eaor-webserver:latest
    container_name: nfshs-online
    restart: unless-stopped
    ports:
      # Host port is configurable: NFSHS_PORT=9000 docker compose up -d
      - "${NFSHS_PORT:-8123}:8123"
    volumes:
      - nfshs-data:/data

volumes:
  nfshs-data:
